# Mission 10A SQL Connect application schema.
# database/schema.sql is the authoritative physical model. Explicit FK scalar
# fields preserve canonical column names; relation fields bind through @ref.

type ActorProfile @table(name: "actor_profiles") {
  id: UUID!
  externalId: String @col(name: "external_id") @unique
  firebaseUid: String @col(name: "firebase_uid") @unique
  actorKind: String! @col(name: "actor_kind")
  displayName: String! @col(name: "display_name")
  email: String
  status: String! @default(value: "active")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type ActorRole @table(name: "actor_roles") {
  id: UUID!
  actorId: UUID! @col(name: "actor_id")
  actor: ActorProfile! @ref(fields: ["actorId"])
  roleCode: String! @col(name: "role_code")
  scopeType: String! @col(name: "scope_type") @default(value: "global")
  scopeKey: String! @col(name: "scope_key") @default(value: "*")
  grantedById: UUID @col(name: "granted_by")
  grantedBy: ActorProfile @ref(fields: ["grantedById"])
  grantedAt: Timestamp! @col(name: "granted_at") @default(sql: "CURRENT_TIMESTAMP")
  validFrom: Timestamp! @col(name: "valid_from") @default(sql: "CURRENT_TIMESTAMP")
  validUntil: Timestamp @col(name: "valid_until")
  revokedAt: Timestamp @col(name: "revoked_at")
  revocationReason: String @col(name: "revocation_reason")
}

type Sector @table(name: "sectors") {
  id: UUID!
  code: String! @unique
  label: String!
  taxonomyLevel: String! @col(name: "taxonomy_level")
  parentSectorId: UUID @col(name: "parent_sector_id")
  parentSector: Sector @ref(fields: ["parentSectorId"])
  description: String
  publicOrder: Int @col(name: "public_order")
  active: Boolean! @default(value: true)
  vocabularyVersion: String! @col(name: "vocabulary_version") @default(value: "1.1.2")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type Institution @table(name: "institutions") {
  id: UUID!
  externalId: String @col(name: "external_id") @unique
  slug: String! @unique
  canonicalName: String! @col(name: "canonical_name")
  shortName: String @col(name: "short_name")
  aliases: Any! @col(dataType: "jsonb") @default(sql: "'[]'::jsonb")
  institutionType: String! @col(name: "institution_type")
  parentInstitutionId: UUID @col(name: "parent_institution_id")
  parentInstitution: Institution @ref(fields: ["parentInstitutionId"])
  officialUrl: String @col(name: "official_url")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type Record @table(name: "records") {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  slug: String! @unique
  recordType: String! @col(name: "record_type")
  title: String!
  shortTitle: String @col(name: "short_title")
  summary: String!
  body: String
  implementationStatus: String! @col(name: "implementation_status")
  workflowStatus: String! @col(name: "workflow_status") @default(value: "draft")
  publicationStatus: String! @col(name: "publication_status") @default(value: "unpublished")
  verificationStatus: String! @col(name: "verification_status") @default(value: "under_review")
  evidenceProfile: String! @col(name: "evidence_profile")
  riskLevel: String! @col(name: "risk_level") @default(value: "low")
  isPublic: Boolean! @col(name: "is_public") @default(value: false)
  qualification: String
  internalNotes: String @col(name: "internal_notes")
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  currentRevision: Int! @col(name: "current_revision") @default(value: 1)
  publishedAt: Timestamp @col(name: "published_at")
  withdrawnAt: Timestamp @col(name: "withdrawn_at")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type PolicyDetail @table(name: "policy_details", key: ["record"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  policyType: String! @col(name: "policy_type")
  legalAuthority: String @col(name: "legal_authority")
  referenceNumber: String @col(name: "reference_number")
  effectScope: String @col(name: "effect_scope")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type ProjectDetail @table(name: "project_details", key: ["record"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  projectType: String! @col(name: "project_type")
  progressPercentage: Float @col(name: "progress_percentage", dataType: "numeric(5,2)")
  contractReference: String @col(name: "contract_reference")
  projectReference: String @col(name: "project_reference")
  locationNarrative: String @col(name: "location_narrative")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type ProgrammeDetail @table(name: "programme_details", key: ["record"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  programmeType: String! @col(name: "programme_type")
  targetGroupNarrative: String @col(name: "target_group_narrative")
  enrolmentModel: String @col(name: "enrolment_model")
  disbursementModel: String @col(name: "disbursement_model")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type AchievementProfile @table(name: "achievement_profiles", key: ["record"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  publicImpactNarrative: String! @col(name: "public_impact_narrative")
  publicQualification: String @col(name: "public_qualification")
  featuredAssetUrl: String @col(name: "featured_asset_url")
  displayPriority: Int! @col(name: "display_priority") @default(value: 0)
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type RecordInstitution
  @table(name: "record_institutions", key: ["record", "institution", "roleCode"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  institutionId: UUID! @col(name: "institution_id")
  institution: Institution! @ref(fields: ["institutionId"])
  roleCode: String! @col(name: "role_code")
  validFrom: Date @col(name: "valid_from")
  validUntil: Date @col(name: "valid_until")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
}

type RecordSector
  @table(name: "record_sectors", key: ["record", "sector", "roleCode"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  sectorId: UUID! @col(name: "sector_id")
  sector: Sector! @ref(fields: ["sectorId"])
  roleCode: String! @col(name: "role_code")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
}

type GeographicUnit @table(name: "geographic_units") {
  id: UUID!
  externalId: String @col(name: "external_id") @unique
  code: String! @unique
  name: String!
  geographyType: String! @col(name: "geography_type")
  parentGeographicUnitId: UUID @col(name: "parent_geographic_unit_id")
  parentGeographicUnit: GeographicUnit @ref(fields: ["parentGeographicUnitId"])
  latitude: Float @col(dataType: "numeric(9,6)")
  longitude: Float @col(dataType: "numeric(9,6)")
  boundaryGeojson: Any @col(name: "boundary_geojson", dataType: "jsonb")
  sensitivityClass: String! @col(name: "sensitivity_class") @default(value: "public")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type RecordGeography
  @table(name: "record_geographies", key: ["record", "geographicUnit", "coverageRole"]) {
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  geographicUnitId: UUID! @col(name: "geographic_unit_id")
  geographicUnit: GeographicUnit! @ref(fields: ["geographicUnitId"])
  coverageRole: String! @col(name: "coverage_role")
  confidence: Float @col(dataType: "numeric(4,3)")
  qualification: String
  sensitivityClass: String! @col(name: "sensitivity_class") @default(value: "public")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
}

type Source @table(name: "sources") {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  title: String!
  publisherInstitutionId: UUID @col(name: "publisher_institution_id")
  publisherInstitution: Institution @ref(fields: ["publisherInstitutionId"])
  publisherName: String @col(name: "publisher_name")
  sourceType: String! @col(name: "source_type")
  sourceLevel: String! @col(name: "source_level")
  originalUrl: String @col(name: "original_url")
  archivalUrl: String @col(name: "archival_url")
  documentNumber: String @col(name: "document_number")
  publicationDate: Date @col(name: "publication_date")
  publicationDatePrecision: String! @col(name: "publication_date_precision") @default(value: "unknown")
  publicationPeriodStart: Date @col(name: "publication_period_start")
  publicationPeriodEnd: Date @col(name: "publication_period_end")
  publicationDateLabel: String @col(name: "publication_date_label")
  accessDate: Date! @col(name: "access_date")
  sourceStatus: String! @col(name: "source_status")
  sha256: String
  languageCode: String! @col(name: "language_code") @default(value: "en")
  visibilityClass: String! @col(name: "visibility_class") @default(value: "internal")
  metadata: Any! @col(dataType: "jsonb") @default(sql: "'{}'::jsonb")
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type EvidenceClaim @table(name: "evidence_claims") {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  claimType: String! @col(name: "claim_type")
  claimText: String! @col(name: "claim_text")
  valueNumeric: Float @col(name: "value_numeric", dataType: "numeric(30,8)")
  valueText: String @col(name: "value_text")
  unitCode: String @col(name: "unit_code")
  currencyCode: String @col(name: "currency_code", dataType: "char(3)")
  dateValue: Date @col(name: "date_value")
  datePrecision: String! @col(name: "date_precision") @default(value: "unknown")
  periodStart: Date @col(name: "period_start")
  periodEnd: Date @col(name: "period_end")
  reportingPeriodLabel: String @col(name: "reporting_period_label")
  periodIsProvisional: Boolean! @col(name: "period_is_provisional") @default(value: false)
  geographicUnitId: UUID @col(name: "geographic_unit_id")
  geographicUnit: GeographicUnit @ref(fields: ["geographicUnitId"])
  dataValueNature: String! @col(name: "data_value_nature")
  sourceOrigin: String! @col(name: "source_origin")
  verificationStatus: String! @col(name: "verification_status")
  evidenceProfile: String! @col(name: "evidence_profile")
  riskLevel: String! @col(name: "risk_level")
  workflowStatus: String! @col(name: "workflow_status") @default(value: "draft")
  limitations: String
  internalNotes: String @col(name: "internal_notes")
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  currentRevision: Int! @col(name: "current_revision") @default(value: 1)
  withdrawnAt: Timestamp @col(name: "withdrawn_at")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type ClaimSourceRelationship
  @table(name: "claim_source_relationships")
  @unique(fields: ["claimId", "sourceId", "sourceRole", "relationshipType", "evidenceLocation"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  claimId: UUID! @col(name: "claim_id")
  claim: EvidenceClaim! @ref(fields: ["claimId"])
  sourceId: UUID! @col(name: "source_id")
  source: Source! @ref(fields: ["sourceId"])
  sourceRole: String! @col(name: "source_role")
  relationshipType: String! @col(name: "relationship_type")
  evidenceLocation: String! @col(name: "evidence_location")
  evidenceSummary: String! @col(name: "evidence_summary")
  limitation: String
  reviewStatus: String! @col(name: "review_status") @default(value: "draft")
  reviewedById: UUID @col(name: "reviewed_by")
  reviewedBy: ActorProfile @ref(fields: ["reviewedById"])
  reviewedAt: Timestamp @col(name: "reviewed_at")
  supersedesRelationshipId: UUID @col(name: "supersedes_relationship_id")
  supersedesRelationship: ClaimSourceRelationship @ref(fields: ["supersedesRelationshipId"])
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type FinancialRecord
  @table(name: "financial_records")
  @unique(fields: ["recordId", "claimId", "financialType", "currencyCode", "periodStart", "periodEnd", "aggregationBasis"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  claimId: UUID! @col(name: "claim_id")
  claim: EvidenceClaim! @ref(fields: ["claimId"])
  geographicUnitId: UUID @col(name: "geographic_unit_id")
  geographicUnit: GeographicUnit @ref(fields: ["geographicUnitId"])
  financialType: String! @col(name: "financial_type")
  amount: Float! @col(dataType: "numeric(24,4)")
  currencyCode: String! @col(name: "currency_code", dataType: "char(3)")
  reportingPeriodLabel: String! @col(name: "reporting_period_label")
  periodStart: Date! @col(name: "period_start")
  periodEnd: Date! @col(name: "period_end")
  datePrecision: String! @col(name: "date_precision")
  aggregationBasis: String! @col(name: "aggregation_basis")
  nominalOrReal: String! @col(name: "nominal_or_real")
  methodology: String
  limitations: String
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type BeneficiaryRecord
  @table(name: "beneficiary_records")
  @unique(fields: ["recordId", "beneficiaryStage", "beneficiaryType", "periodStart", "periodEnd", "geographicUnitId", "cohortKey"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  claimId: UUID! @col(name: "claim_id")
  claim: EvidenceClaim! @ref(fields: ["claimId"])
  geographicUnitId: UUID @col(name: "geographic_unit_id")
  geographicUnit: GeographicUnit @ref(fields: ["geographicUnitId"])
  beneficiaryType: String! @col(name: "beneficiary_type")
  beneficiaryStage: String! @col(name: "beneficiary_stage")
  countValue: Int64! @col(name: "count_value", dataType: "bigint")
  unit: String!
  countBasis: String! @col(name: "count_basis")
  cumulative: Boolean!
  reportingPeriodLabel: String! @col(name: "reporting_period_label")
  periodStart: Date! @col(name: "period_start")
  periodEnd: Date! @col(name: "period_end")
  cohortKey: String! @col(name: "cohort_key")
  methodology: String
  doubleCountingNotes: String @col(name: "double_counting_notes")
  limitations: String
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type Indicator
  @table(name: "indicators") {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  slug: String! @unique
  name: String!
  definition: String!
  unit: String!
  frequency: String!
  methodology: String!
  sectorId: UUID @col(name: "sector_id")
