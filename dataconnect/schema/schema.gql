  approvedById: UUID @col(name: "approved_by")
  approvedBy: ActorProfile @ref(fields: ["approvedById"])
  approvedAt: Timestamp @col(name: "approved_at")
  effectiveAt: Timestamp @col(name: "effective_at")
  publicNotice: String @col(name: "public_notice")
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
}

type ReviewDecision
  @table(name: "review_decisions")
  @unique(fields: ["recordId", "recordRevision", "gateCode", "reviewerId"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  recordId: UUID! @col(name: "record_id")
  record: Record! @ref(fields: ["recordId"])
  claimId: UUID @col(name: "claim_id")
  claim: EvidenceClaim @ref(fields: ["claimId"])
  relationshipId: UUID @col(name: "relationship_id")
  relationship: ClaimSourceRelationship @ref(fields: ["relationshipId"])
  subjectScope: String! @col(name: "subject_scope")
  recordRevision: Int! @col(name: "record_revision")
  gateCode: String! @col(name: "gate_code")
  decision: String!
  reviewerId: UUID! @col(name: "reviewer_id")
  reviewer: ActorProfile! @ref(fields: ["reviewerId"])
  rationale: String!
  riskLevel: String! @col(name: "risk_level")
  decidedAt: Timestamp! @col(name: "decided_at") @default(sql: "CURRENT_TIMESTAMP")
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
}

type RecordRelationship
  @table(name: "record_relationships")
  @unique(fields: ["fromRecordId", "toRecordId", "relationshipRole"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  fromRecordId: UUID! @col(name: "from_record_id")
  fromRecord: Record! @ref(fields: ["fromRecordId"])
  toRecordId: UUID! @col(name: "to_record_id")
  toRecord: Record! @ref(fields: ["toRecordId"])
  relationshipRole: String! @col(name: "relationship_role")
  validFrom: Date @col(name: "valid_from")
  validUntil: Date @col(name: "valid_until")
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
