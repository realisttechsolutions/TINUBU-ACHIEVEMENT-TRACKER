  sourceInstitutionId: UUID @col(name: "source_institution_id")
  sourceInstitution: Institution @ref(fields: ["sourceInstitutionId"])
  causalAttributionProhibited: Boolean! @col(name: "causal_attribution_prohibited") @default(value: true)
  active: Boolean! @default(value: true)
  createdById: UUID! @col(name: "created_by")
  createdBy: ActorProfile! @ref(fields: ["createdById"])
  createdAt: Timestamp! @col(name: "created_at") @default(sql: "CURRENT_TIMESTAMP")
  updatedAt: Timestamp! @col(name: "updated_at") @default(sql: "CURRENT_TIMESTAMP")
}

type IndicatorObservation
  @table(name: "indicator_observations")
  @unique(fields: ["indicatorId", "periodStart", "periodEnd", "geographicUnitId", "dataValueNature", "revision"]) {
  id: UUID!
  externalId: String! @col(name: "external_id") @unique
  indicatorId: UUID! @col(name: "indicator_id")
  indicator: Indicator! @ref(fields: ["indicatorId"])
  claimId: UUID! @col(name: "claim_id")
