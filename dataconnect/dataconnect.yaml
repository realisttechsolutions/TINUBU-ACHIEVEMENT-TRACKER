specVersion: "v1"
serviceId: "tat-staging"
location: "us-central1"
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: "tat_staging"
      cloudSql:
        instanceId: "tat-db-staging"
      # Canonical DDL adds checks, partial/GIN indexes, triggers, append-only
      # guards, and public views that SQL Connect cannot fully represent.
      schemaValidation: "COMPATIBLE"
connectorDirs:
  - "./public"
  - "./staff"
